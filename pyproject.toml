[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geoanalytics-widget"
version = "0.3.0"
description = "A minimal notebook map for feature services and Parquet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anywidget>=0.7.1,<1",
    "ipywidgets>=7.7.2,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoanalytics_widget = ["map.js", "py.typed"]
